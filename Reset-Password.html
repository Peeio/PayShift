<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Gestión de Turnos & Nómina</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z'/></svg>"
        type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { darkMode: 'class', }</script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- SDKs de Firebase (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
            min-height: 100dvh;
        }

        html:not(.dark) body {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .auth-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        html:not(.dark) .auth-card {
            background-color: #ffffff;
            border-color: #cbd5e1;
            box-shadow: 0 10px 25px -5px rgba(100, 116, 139, 0.1);
        }

        #authPrimaryBtn {
            box-shadow: 0 4px 20px -2px rgba(37, 99, 235, 0.4);
        }

        html:not(.dark) input[type="password"] {
            background-color: #f8fafc;
            color: #0f172a;
            border-color: #cbd5e1;
        }

        .select-none {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 flex items-center justify-center p-4 select-none">

    <!-- Tarjeta Principal -->
    <div class="auth-card bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 w-full max-w-md space-y-6 shadow-2xl relative">

        <!-- Encabezado -->
        <div class="text-center space-y-2 pt-2">
            <div class="inline-flex p-3 bg-blue-600/20 text-blue-400 rounded-2xl mb-1">
                <i data-lucide="key-round" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Nueva Contraseña</h2>
            <p class="text-xs md:text-sm text-slate-400">Ingresa la nueva contraseña para tu cuenta</p>
        </div>

        <!-- Formularios -->
        <form id="passwordForm" onsubmit="handleChangePassword(event)" class="space-y-4">

            <!-- Nueva Contraseña -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Nueva Contraseña</label>
                <div class="relative flex items-center">
                    <input type="password" id="newPassword" required
                        oninput="checkPasswordRequirements(this.value)"
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 pr-11 text-sm text-white focus:outline-none focus:border-blue-500 transition-all"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePasswordVisibility('newPassword', this)"
                        class="absolute right-3.5 text-slate-400 hover:text-white transition-colors focus:outline-none p-1 flex items-center justify-center">
                        <i data-lucide="eye" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Confirmar Nueva Contraseña -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Confirmar Nueva Contraseña</label>
                <div class="relative flex items-center">
                    <input type="password" id="confirmPassword" required
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 pr-11 text-sm text-white focus:outline-none focus:border-blue-500 transition-all"
                        placeholder="••••••••">
                    <button type="button" onclick="togglePasswordVisibility('confirmPassword', this)"
                        class="absolute right-3.5 text-slate-400 hover:text-white transition-colors focus:outline-none p-1 flex items-center justify-center">
                        <i data-lucide="eye" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Panel de Validación de Requisitos -->
            <div id="passwordRequirementsPanel" class="p-3 bg-slate-950/60 rounded-xl border border-slate-800 text-xs space-y-1">
                <div class="text-slate-400 font-semibold mb-1">Requisitos de la contraseña:</div>
                <div id="req-length" class="flex items-center gap-1.5 text-slate-500"><span class="w-3.5 h-3.5 inline-flex items-center justify-center font-bold">✕</span> Mínimo 8 caracteres</div>
                <div id="req-upper" class="flex items-center gap-1.5 text-slate-500"><span class="w-3.5 h-3.5 inline-flex items-center justify-center font-bold">✕</span> Al menos una letra mayúscula</div>
                <div id="req-lower" class="flex items-center gap-1.5 text-slate-500"><span class="w-3.5 h-3.5 inline-flex items-center justify-center font-bold">✕</span> Al menos una letra minúscula</div>
                <div id="req-number" class="flex items-center gap-1.5 text-slate-500"><span class="w-3.5 h-3.5 inline-flex items-center justify-center font-bold">✕</span> Al menos un número</div>
                <div id="req-special" class="flex items-center gap-1.5 text-slate-500"><span class="w-3.5 h-3.5 inline-flex items-center justify-center font-bold">✕</span> Al menos un carácter especial</div>
            </div>

            <button id="authPrimaryBtn" type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl text-sm transition duration-200 flex items-center justify-center gap-2">
                Cambiar Contraseña
            </button>
        </form>
    </div>

    <!-- Modal Alerta Personalizado -->
    <div id="customAlertModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-xs w-full space-y-4 shadow-2xl text-center">
            <div class="inline-flex p-3 bg-amber-500/20 text-amber-400 rounded-2xl">
                <i data-lucide="alert-circle" class="w-6 h-6"></i>
            </div>
            <h4 id="customAlertTitle" class="font-bold text-white text-base">Atención</h4>
            <p id="customAlertMessage" class="text-slate-400 text-sm"></p>
            <button id="customAlertBtn" onclick="closeCustomAlertModal()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold transition">
                Entendido
            </button>
        </div>
    </div>

    <script>
        const RUTA_LOGIN = '/';

        const firebaseConfig = {
            apiKey: "AIzaSyAvcqxV9UTRyJLQHD6r7rUqikB53WskTdQ",
            authDomain: "payshift-0.firebaseapp.com",
            projectId: "payshift-0",
            storageBucket: "payshift-0.firebasestorage.app",
            messagingSenderId: "905065765221",
            appId: "1:905065765221:web:b47a3a4ce145b9e855698c",
            measurementId: "G-W9PZRNGXQF"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        auth.languageCode = 'es';

        const urlParams = new URLSearchParams(window.location.search);
        const actionMode = urlParams.get('mode');
        const actionCode = urlParams.get('oobCode');

        function redirectToLoginNow() {
            window.location.replace(RUTA_LOGIN);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();

            // REDIRECCIÓN DIRECTA: Si no viene desde la URL del correo de restablecimiento
            if (actionMode !== 'resetPassword' || !actionCode) {
                redirectToLoginNow();
                return;
            }

            // Validar que el código recibido en la URL siga siendo válido
            try {
                await auth.verifyPasswordResetCode(actionCode);
            } catch (error) {
                console.error("Código de restablecimiento no válido o expirado:", error);
                openCustomAlertModal(
                    "Enlace no válido",
                    "El enlace para restablecer la contraseña ha caducado o ya ha sido utilizado.",
                    "Ir al Login",
                    redirectToLoginNow
                );
            }
        });

        function togglePasswordVisibility(inputId, btn) {
            const pwdInput = document.getElementById(inputId);
            const icon = btn.querySelector('[data-lucide]');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function checkPasswordRequirements(pwd) {
            const hasLen = pwd.length >= 8;
            const hasUpper = /[A-Z]/.test(pwd);
            const hasLower = /[a-z]/.test(pwd);
            const hasNum = /[0-9]/.test(pwd);
            const hasSpecial = /[^A-Za-z0-9]/.test(pwd);

            updateReqItem('req-length', hasLen);
            updateReqItem('req-upper', hasUpper);
            updateReqItem('req-lower', hasLower);
            updateReqItem('req-number', hasNum);
            updateReqItem('req-special', hasSpecial);

            return hasLen && hasUpper && hasLower && hasNum && hasSpecial;
        }

        function updateReqItem(elementId, isValid) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const span = el.querySelector('span');
            if (isValid) {
                el.className = "flex items-center gap-1.5 text-emerald-400 font-semibold";
                span.innerText = "✓";
            } else {
                el.className = "flex items-center gap-1.5 text-slate-500";
                span.innerText = "✕";
            }
        }

        function setButtonLoading(btn, loading, loadingText) {
            if (loading) {
                btn.dataset.originalHtml = btn.innerHTML;
                btn.disabled = true;
                btn.classList.add('opacity-60', 'cursor-not-allowed');
                btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> ${loadingText}`;
                lucide.createIcons();
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-60', 'cursor-not-allowed');
                if (btn.dataset.originalHtml) btn.innerHTML = btn.dataset.originalHtml;
                lucide.createIcons();
            }
        }

        async function handleChangePassword(e) {
            e.preventDefault();
            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('authPrimaryBtn');

            if (newPwd !== confirmPwd) {
                openCustomAlertModal("Error", "Las nuevas contraseñas no coinciden.");
                return;
            }

            if (!checkPasswordRequirements(newPwd)) {
                openCustomAlertModal("Seguridad", "La contraseña no cumple con todos los requisitos de seguridad.");
                return;
            }

            setButtonLoading(btn, true, 'Guardando...');

            try {
                // Comando de Firebase para cambiar la contraseña usando el código oobCode
                await auth.confirmPasswordReset(actionCode, newPwd);

                openCustomAlertModal(
                    "¡Contraseña Actualizada!",
                    "Tu contraseña ha sido cambiada con éxito. Ya puedes acceder con tus nuevas credenciales.",
                    "Ir al inicio de sesión",
                    redirectToLoginNow
                );
            } catch (error) {
                console.error("Error al restablecer contraseña:", error);
                openCustomAlertModal(
                    "Error",
                    "No se pudo guardar la contraseña. Es posible que el enlace haya caducado. Vuelve a solicitar un restablecimiento.",
                    "Ir al Login",
                    redirectToLoginNow
                );
            } finally {
                setButtonLoading(btn, false);
            }
        }

        function openCustomAlertModal(title, msg, btnText = "Entendido", onButtonClick = null) {
            document.getElementById('customAlertTitle').innerText = title;
            document.getElementById('customAlertMessage').innerText = msg;
            
            const alertBtn = document.getElementById('customAlertBtn');
            alertBtn.innerText = btnText;
            
            alertBtn.onclick = function () {
                closeCustomAlertModal();
                if (typeof onButtonClick === 'function') {
                    onButtonClick();
                }
            };

            document.getElementById('customAlertModal').classList.remove('hidden');
        }

        function closeCustomAlertModal() {
            document.getElementById('customAlertModal').classList.add('hidden');
        }
    </script>
</body>

</html>
